plugins {
    id 'com.android.application'
}

def repo = file("${rootDir}/../..")
def sdlJava = file("${repo}/.deps/sdl3-src/android-project/app/src/main/java")
def packedAssets = layout.buildDirectory.dir('packed-assets')

// The release key: EMUDEN_KEYSTORE_FILE and friends (CI), else
// ~/.emuden-android-signing/signing.properties (the owner's PC); without either, the debug key.
def releaseSigning = { ->
    def env = System.getenv()
    if (env.EMUDEN_KEYSTORE_FILE) {
        return [storeFile: env.EMUDEN_KEYSTORE_FILE, storePassword: env.EMUDEN_KEYSTORE_PASSWORD,
                keyAlias: env.EMUDEN_KEY_ALIAS ?: 'emuden', keyPassword: env.EMUDEN_KEY_PASSWORD ?: env.EMUDEN_KEYSTORE_PASSWORD]
    }
    def file = new File(System.getProperty('user.home'), '.emuden-android-signing/signing.properties')
    if (!file.exists()) {
        return null
    }
    def props = new Properties()
    file.withInputStream { props.load(it) }
    return [storeFile: props.storeFile, storePassword: props.storePassword, keyAlias: props.keyAlias,
            keyPassword: props.keyPassword]
}()

// Versions go up with every commit, so an update always installs over the one before.
def commitCount = { ->
    try {
        def out = providers.exec { commandLine 'git', '-C', repo.path, 'rev-list', '--count', 'HEAD' }
        return out.standardOutput.asText.get().trim().toInteger()
    } catch (Exception ignored) {
        return 1
    }
}
def emudenVersionCode = providers.gradleProperty('emudenVersionCode').map { it.toInteger() }.getOrElse(commitCount())
def emudenVersionName = providers.gradleProperty('emudenVersion').getOrElse('0.1.0')
// Only a build given -PemudenVersion is a release, which offers updates (EMUDEN_VERSION).
def emudenReleaseVersion = providers.gradleProperty('emudenVersion').getOrElse('')
// -PemudenUpdateRepo=owner/name: where the app looks for updates (EMUDEN_UPDATE_REPO).
def emudenUpdateRepo = providers.gradleProperty('emudenUpdateRepo').getOrElse('Denarmo/emuden')

android {
    namespace 'io.github.denarmo.emuden'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        // ".next" so it installs beside the previous app.
        applicationId 'io.github.denarmo.emuden.next'
        minSdk 28
        targetSdk 36
        versionCode emudenVersionCode
        versionName emudenVersionName
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // The same variables as the "android" CMake preset.
                arguments '-DANDROID_STL=c++_shared', '-DDEN_BUILD_TESTS=OFF',
                        '-DCMAKE_BUILD_TYPE=RelWithDebInfo', "-DEMUDEN_VERSION=${emudenReleaseVersion}",
                        "-DEMUDEN_UPDATE_REPO=${emudenUpdateRepo}"
                targets 'den_app'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("${repo}/CMakeLists.txt")
            version '3.31.5'
            buildStagingDirectory file("${repo}/build/${rootProject.ext.emudenBuild}/cxx")
        }
    }

    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseSigning != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            // -PemudenDebuggable=true: run-as works, for testing on a device with its data.
            debuggable providers.gradleProperty('emudenDebuggable').getOrElse('false') == 'true'
        }
    }

    sourceSets {
        main {
            // SDL's activity comes from the SDL sources CMake fetched.
            java.srcDirs = ['src/main/java', sdlJava]
            assets.srcDirs = [packedAssets]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// The app's assets folder goes into the APK as assets/emuden; the activity unpacks it.
def packAssets = tasks.register('packAssets', Sync) {
    from("${repo}/assets")
    into(packedAssets.map { it.dir('emuden') })
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn(packAssets)
    }
    // The first CMake configure fetches SDL, whose Java sources are compiled here.
    if (task.name.startsWith('compile') && task.name.endsWith('JavaWithJavac')) {
        task.dependsOn(tasks.matching { it.name.startsWith('configureCMake') })
    }
}
