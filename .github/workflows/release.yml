# Builds EmuDEN for Windows, Linux and Android and publishes them as a GitHub release.
# Runs on a pushed tag "v*" (the release takes the tag's name) or by hand from the Actions tab
# (a draft release named after the commit). Each build uploads straight to a draft release,
# which does not count against the artifact storage of a private repository.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # "v1.2.3" for tag v1.2.3, else empty.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - id: draft
        run: |
          if [ -n "$VERSION" ]; then
            tag="$VERSION"; title="EmuDEN ${VERSION#v}"
          else
            tag="build-${GITHUB_SHA::7}"; title="EmuDEN build ${GITHUB_SHA::7}"
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes "Built from ${GITHUB_SHA}."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-windows-${{ hashFiles('cmake/deps.cmake') }}
      - name: Ninja
        run: pip install ninja
      - name: Build and package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Build -BuildDir build\win -Out dist\EmuDEN-windows-x64 -Zip
      - name: Upload
        shell: bash
        run: gh release upload "${{ needs.draft.outputs.tag }}" dist/EmuDEN-windows-x64.zip --clobber -R "$GITHUB_REPOSITORY"

  linux:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang ninja-build cmake pkg-config \
            libcurl4-openssl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libegl-dev libgles-dev libgl-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev \
            squashfs-tools librsvg2-bin desktop-file-utils libwebkit2gtk-4.1-0 glib-networking patchelf
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('cmake/deps.cmake') }}
      - name: Build
        run: |
          cmake --preset linux -B build/linux -DDEN_BUILD_TESTS=OFF
          cmake --build build/linux --parallel --target den_app
      - name: Package
        env:
          EMUDEN_WEBKIT: '1'
        run: sh tools/linux/package.sh build/linux dist
      - name: Upload
        run: gh release upload "${{ needs.draft.outputs.tag }}" dist/EmuDEN-x86_64.AppImage --clobber -R "$GITHUB_REPOSITORY"

  android:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version code counts the commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-android-${{ hashFiles('cmake/deps.cmake') }}
      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.5" "platforms;android-36" >/dev/null
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.EMUDEN_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "the EMUDEN_KEYSTORE_B64 secret is missing" >&2; exit 1; }
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/emuden-release.jks"
      - name: Build
        working-directory: shells/android
        env:
          EMUDEN_KEYSTORE_FILE: ${{ runner.temp }}/emuden-release.jks
          EMUDEN_KEYSTORE_PASSWORD: ${{ secrets.EMUDEN_KEYSTORE_PASSWORD }}
          EMUDEN_KEY_ALIAS: emuden
        run: |
          name="${VERSION#v}"
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PemudenBuild=android-release ${name:+-PemudenVersion=$name}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/build/android-release/gradle/app/outputs/apk/release/app-release.apk" \
             "$GITHUB_WORKSPACE/dist/EmuDEN-android-arm64.apk"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/emuden-release.jks"
      - name: Upload
        run: gh release upload "${{ needs.draft.outputs.tag }}" dist/EmuDEN-android-arm64.apk --clobber -R "$GITHUB_REPOSITORY"

  publish:
    needs: [draft, windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Checksums
        run: |
          tag="${{ needs.draft.outputs.tag }}"
          mkdir dist && cd dist
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'EmuDEN-*'
          sha256sum EmuDEN-* > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish a tagged release
        if: env.VERSION != ''
        run: gh release edit "$VERSION" -R "$GITHUB_REPOSITORY" --draft=false
