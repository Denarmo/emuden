# Linux build and unit tests (tools/linux/build.sh) on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang ninja-build cmake pkg-config ccache \
            libcurl4-openssl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libegl-dev libgles-dev libgl-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev

      # Third-party sources (cmake/deps.cmake fetches them into .deps).
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/deps.cmake') }}

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure
        run: >
          cmake --preset linux -B build/linux
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/linux --parallel

      - name: Test
        run: ctest --test-dir build/linux --output-on-failure --parallel 4

      - name: Cache use
        if: always()
        run: ccache --show-stats
